name: Website checks
on:
  push:
    paths:
      - 'website/**'
      - 'scripts/version-website-assets.mjs'
      - 'scripts/version-website-assets.test.mjs'
      - '.github/workflows/website-checks.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check current download and group flows
        run: node --test website/tests/free-v2-frontend.test.mjs website/tests/installer-click.test.mjs scripts/version-website-assets.test.mjs

name: Windows render performance candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the candidate and native cache checks
        shell: pwsh
        run: |
          cmake -S . -B build-perf -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed' }
          cmake --build build-perf --config Release --target niuma-merit niuma-render-cache-test --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Check identical pixels, bounded memory and GDI cleanup
        shell: pwsh
        run: |
          & ./build-perf/Release/niuma-render-cache-test.exe | Tee-Object build-perf/render-cache-result.json
          if ($LASTEXITCODE -ne 0) { throw 'Native render cache checks failed' }
          $record = [ordered]@{
            sourceCommit = $env:GITHUB_SHA
            clientSha256 = (Get-FileHash build-perf/Release/niuma-merit.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            candidateOnly = $true
            signed = $false
            installerBuilt = $false
            clientExecuted = $false
            published = $false
          }
          $record | ConvertTo-Json | Set-Content build-perf/build-info.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: windows-render-performance-${{ github.sha }}
          path: |
            build-perf/Release/niuma-merit.exe
            build-perf/Release/niuma-render-cache-test.exe
            build-perf/render-cache-result.json
            build-perf/build-info.json
          if-no-files-found: error
          retention-days: 14

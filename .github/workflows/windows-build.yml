name: Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read version
        shell: bash
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Build Release package
        shell: powershell
        run: ./scripts/build-windows.ps1

      - name: Verify offline-only client
        shell: bash
        run: ./scripts/audit-offline.sh

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: niuma-merit-windows-${{ env.VERSION }}
          path: |
            dist/niuma-merit.exe
            dist/niuma-merit-windows-${{ env.VERSION }}-Release.zip
          if-no-files-found: error
          retention-days: 14

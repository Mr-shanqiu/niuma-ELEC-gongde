name: Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read version
        shell: bash
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Build Release package
        shell: powershell
        run: ./scripts/build-windows.ps1

      - name: Verify offline-only client
        shell: bash
        run: ./scripts/audit-offline.sh

      - name: Build Windows installer
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found"
          }
          & $iscc "/DMyAppVersion=$env:VERSION" "installer\windows\niuma-merit.iss"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: niuma-merit-windows-${{ env.VERSION }}-setup
          path: dist/niuma-merit-windows-${{ env.VERSION }}-setup.exe
          if-no-files-found: error
          retention-days: 14

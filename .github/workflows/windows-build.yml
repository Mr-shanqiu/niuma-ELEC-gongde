name: Windows Build
on:
  push:
    branches: [codex/windows-release-094-20261017]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build menu and About update without rerunning counter acceptance
        shell: powershell
        run: ./scripts/build-windows.ps1 -ClientOnly -ExpectedVersion 0.9.4
      - name: Build Chinese Windows installer
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found" }
          & $iscc "/DMyAppVersion=0.9.4" "installer\windows\niuma-merit.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          & ./scripts/verify-windows-artifact.ps1 -ExecutablePath "dist\niuma-merit-windows-0.9.4-setup.exe" -ExpectedVersion 0.9.4 -ArtifactKind installer -ReceiptPath "dist\installer-artifact.json"
      - uses: actions/upload-artifact@v4
        with:
          name: niuma-merit-windows-0.9.4-setup
          path: |
            dist/niuma-merit-windows-0.9.4-setup.exe
            dist/installer-artifact.json
            build-windows/release-evidence-*/*.json
          if-no-files-found: error
          retention-days: 14

name: Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Release package
        shell: powershell
        run: ./scripts/build-windows.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: niuma-merit-windows-0.3.0
          path: |
            dist/niuma-merit.exe
            dist/niuma-merit-windows-0.3.0-Release.zip
          if-no-files-found: error
          retention-days: 14

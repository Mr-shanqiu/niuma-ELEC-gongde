name: Payments checks
on:
  push:
    paths:
      - 'services/gongde-payments/**'
      - '.github/workflows/payments-checks.yml'
  pull_request:
    paths:
      - 'services/gongde-payments/**'
      - '.github/workflows/payments-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  payments:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gongde-payments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/gongde-payments/package-lock.json
      - run: npm ci
      - run: npm test

name: Build Unified Acceptance R3

on:
  pull_request:
    paths:
      - '.gitattributes'
      - 'src/**'
      - 'scripts/prepare-reminder-import-acceptance.py'
      - 'scripts/test-windows-acceptance-r2.ps1'
      - 'scripts/test-windows-catalog-file-open.ps1'
      - 'installer/windows/niuma-merit-unified-acceptance-r3.iss'
      - '.github/workflows/reminder-acceptance-r3.yml'
      - 'assets/reminders/official-multilingual-v1.nmgtext'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-r3:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Reuse the fixed R3 package after test-only corrections
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39137652131
          name: windows-unified-acceptance-r3
          path: .local-work/candidates/unified-r3/output
      - name: Verify exact fixed client and installer bytes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = '.local-work/candidates/unified-r3/output'
          if ((Get-FileHash "$output/niuma-merit.exe" -Algorithm SHA256).Hash.ToLowerInvariant() -ne '24b29f28dc629a1dfc3e4abedb7fd75d819f596889189dcd0b404390071cadff') { throw 'Fixed R3 client differs' }
          $installer = @(Get-ChildItem $output -Filter '*.exe' | Where-Object { $_.Name -ne 'niuma-merit.exe' })
          if ($installer.Count -ne 1 -or (Get-FileHash $installer[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ac81cbb033effd8eb98c03a53a8acd056d17ce2366eab369d3a2867089bf29a4') { throw 'Fixed R3 installer differs' }
          # Keep the original build/installation evidence; rerun only the revised check.
          Remove-Item "$output/file-open" -Recurse -Force
      - name: Open signed message files through Explorer file association
        shell: powershell
        run: |
          $output = Join-Path $PWD '.local-work/candidates/unified-r3/output'
          & ./scripts/test-windows-catalog-file-open.ps1 -ClientPath "$output/niuma-merit.exe" -CatalogPath "$output/official-multilingual-v1.nmgtext" -EvidenceDirectory "$output/file-open"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-unified-acceptance-r3
          path: .local-work/candidates/unified-r3/output/*
          if-no-files-found: error
          retention-days: 7

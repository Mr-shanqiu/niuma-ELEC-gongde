name: Offwork Client Compile Only
run-name: Offwork compile-only ${{ github.sha }}

on:
  # Manual only: the branch this used to watch is gone, and a push trigger on a
  # deleted branch can never fire.
  workflow_dispatch:
    inputs:
      mode:
        description: Native test scope
        type: choice
        default: profile
        options: [profile, soak, keyboard-chain, runtime-p0, runtime-p1, runtime-contract, runtime-app, runtime-resources, runtime-composition, runtime-candidate, runtime-durability, runtime-ui, runtime-build, runtime-about, runtime-metrics, runtime-alpha-fast, runtime-region-reuse, runtime-entry, runtime-input-delivery, runtime-integration, runtime-check]

permissions:
  contents: read

concurrency:
  group: offwork-client-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-input-delivery:
    if: ${{ inputs.mode == 'runtime-input-delivery' }}
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile independent synthetic input receiver
        shell: pwsh
        run: |
          cmake -S . -B build-delivery -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "Delivery configuration failed" }
          cmake --build build-delivery --config Release --target niuma-input-delivery-probe --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Delivery build failed" }
      - name: Verify only tagged F24 reaches the owned receiving window
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-delivery/evidence | Out-Null
          & ./build-delivery/Release/niuma-input-delivery-probe.exe (Join-Path $PWD 'build-delivery/evidence/input-delivery.json') 30 | Tee-Object build-delivery/evidence/probe.txt
          if ($LASTEXITCODE -ne 0) { throw "Owned input-delivery smoke test failed" }
          $r = Get-Content build-delivery/evidence/input-delivery.json -Raw | ConvertFrom-Json
          if (-not $r.executionComplete -or $r.receivedPairs -ne 30 -or $r.acceptedInjectedEvents -ne 60 -or $r.sourceToOwnedWindowKeydown.samples -ne 30) { throw "Synthetic delivery count mismatch" }
          if ($r.physicalTypingMeasured -or $r.physicalDisplayLatencyMeasured -or $r.userInputRecorded -or $r.globalHookInstalledByProbe) { throw "Delivery evidence scope mismatch" }
          if (-not $r.externalClockAlignmentValid -or $r.captureStartUtcUnixMs -le 0 -or $r.captureEndUtcUnixMs -le $r.captureStartUtcUnixMs) { throw "External CPU sample clock alignment unavailable" }
          $span = $r.captureEndUtcUnixMs - $r.captureStartUtcUnixMs
          if ([Math]::Abs($span - $r.elapsedMs) -gt 100) { throw "UTC and QPC spans do not align" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-input-delivery-${{ github.sha }}
          path: |
            build-delivery/evidence/**
            build-delivery/Release/niuma-input-delivery-probe.exe
          if-no-files-found: warn
          retention-days: 14

  windows-runtime-entry:
    if: ${{ inputs.mode == 'runtime-entry' }}
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated full entry and independent receiving window
        shell: pwsh
        run: |
          cmake -S . -B build-entry -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "Entry configuration failed" }
          cmake --build build-entry --config Release --target niuma-runtime-entry-probe niuma-runtime-entry-check niuma-input-delivery-probe --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Entry compilation failed" }
      - name: Verify entry rejection, real hooks, final save and normal close
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-entry/evidence | Out-Null
          & ./build-entry/Release/niuma-runtime-entry-check.exe (Join-Path $PWD 'build-entry/Release/niuma-runtime-entry-probe.exe') (Join-Path $PWD 'build-entry/Release/niuma-input-delivery-probe.exe') (Join-Path $PWD 'build-entry/evidence')
          if ($LASTEXITCODE -ne 0) { throw "Full isolated entry did not deliver and persist real-hook counts" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-runtime-entry-${{ github.sha }}
          path: |
            build-entry/Release/niuma-runtime-entry-probe.exe
            build-entry/Release/niuma-runtime-entry-check.exe
            build-entry/Release/niuma-input-delivery-probe.exe
            build-entry/evidence/**
          if-no-files-found: warn
          retention-days: 14

  windows-runtime-metrics:
    if: ${{ inputs.mode == 'runtime-metrics' || inputs.mode == 'runtime-alpha-fast' || inputs.mode == 'runtime-region-reuse' }}
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build new frame measurement and private candidate
        shell: pwsh
        run: |
          cmake -S . -B build-metrics -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "Metrics configuration failed" }
          cmake --build build-metrics --config Release --target niuma-frame-metrics-probe niuma-runtime-candidate --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Metrics compilation failed" }
          if ('${{ inputs.mode }}' -eq 'runtime-region-reuse') {
            cmake --build build-metrics --config Release --target niuma-composition-presenter-test --parallel 2
            if ($LASTEXITCODE -ne 0) { throw "Region reuse contract compilation failed" }
          }
          if ('${{ inputs.mode }}' -eq 'runtime-alpha-fast') {
            cmake --build build-metrics --config Release --target niuma-prepared-alpha-fast-test niuma-fading-alpha-test --parallel 2
            if ($LASTEXITCODE -ne 0) { throw "Affected alpha contracts compilation failed" }
          }
      - name: Verify nonblocking bounded GPU queries and separated frame measurements
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-metrics/evidence | Out-Null
          if ('${{ inputs.mode }}' -eq 'runtime-alpha-fast') {
            & ./build-metrics/Release/niuma-prepared-alpha-fast-test.exe | Tee-Object build-metrics/evidence/alpha-fast.txt
            if ($LASTEXITCODE -ne 0) { throw "Axis spans differ from original geometry" }
            & ./build-metrics/Release/niuma-fading-alpha-test.exe | Tee-Object build-metrics/evidence/fading-alpha.txt
            if ($LASTEXITCODE -ne 0) { throw "Affected opacity contracts failed" }
          }
          if ('${{ inputs.mode }}' -eq 'runtime-region-reuse') {
            & ./build-metrics/Release/niuma-composition-presenter-test.exe --region-reuse-only | Tee-Object build-metrics/evidence/region-reuse.txt
            if ($LASTEXITCODE -ne 0) { throw "Native region reuse differs from fresh coverage or GPU pixels" }
          }
          python scripts/prepare-windows-runtime-acceptance.py build-metrics/runtime-fixtures
          if ($LASTEXITCODE -ne 0) { throw "Private fixtures failed" }
          $env:NIUMA_RUNTIME_FIXTURE_DIR = Join-Path $PWD 'build-metrics/runtime-fixtures'
          & ./build-metrics/Release/niuma-frame-metrics-probe.exe (Join-Path $PWD 'build-metrics/evidence') 15 | Tee-Object build-metrics/evidence/probe.txt
          if ($LASTEXITCODE -ne 0) { throw "New frame metrics diagnostic failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-runtime-metrics-${{ github.sha }}
          path: |
            build-metrics/evidence/**
            build-metrics/Release/niuma-frame-metrics-probe.exe
            build-metrics/Release/niuma-runtime-candidate.exe
            build-metrics/runtime-fixtures/**
          if-no-files-found: warn
          retention-days: 14

  windows-runtime-build:
    if: ${{ inputs.mode == 'runtime-build' || inputs.mode == 'runtime-about' }}
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile private candidate without rerunning closed acceptance suites
        shell: pwsh
        run: |
          cmake -S . -B build-candidate -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "Candidate configuration failed" }
          cmake --build build-candidate --config Release --target niuma-runtime-candidate --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Candidate compilation failed" }
          if ('${{ inputs.mode }}' -eq 'runtime-about') {
            cmake --build build-candidate --config Release --target niuma-about-preview --parallel 2
            if ($LASTEXITCODE -ne 0) { throw "About preview compilation failed" }
            New-Item -ItemType Directory -Path build-candidate/evidence | Out-Null
            & ./build-candidate/Release/niuma-about-preview.exe (Join-Path $PWD 'build-candidate/evidence')
            if ($LASTEXITCODE -ne 0) { throw "About page preview failed" }
          }
      - name: Bind the executable and updated static resource
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, os
          names = ['CMakeLists.txt', 'src/windows/app.cpp', 'src/windows/app.rc',
                   'assets/douyin-group-qr.png']
          exe = Path('build-candidate/Release/niuma-runtime-candidate.exe')
          result = {'commit': os.environ['GITHUB_SHA'], 'kind': 'unsigned-private-candidate',
                    'executableSha256': hashlib.sha256(exe.read_bytes()).hexdigest(),
                    'executableBytes': exe.stat().st_size,
                    'sourceSha256': {n: hashlib.sha256(Path(n).read_bytes()).hexdigest() for n in names},
                    'acceptanceSuitesRerun': False, 'humanVisualAcceptance': False}
          Path('build-candidate/BUILD_BINDING.json').write_text(json.dumps(result, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-build-${{ github.sha }}
          path: |
            build-candidate/Release/niuma-runtime-candidate.exe
            build-candidate/BUILD_BINDING.json
            build-candidate/evidence/**
          if-no-files-found: error
          retention-days: 14

  windows-runtime-ui:
    if: ${{ inputs.mode == 'runtime-ui' }}
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build popup regressions and the complete private candidate
        shell: pwsh
        run: |
          cmake -S . -B build-ui -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "UI configuration failed" }
          cmake --build build-ui --config Release --target niuma-popup-lifecycle-test niuma-runtime-candidate niuma-runtime-durability-probe --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "UI compilation failed" }
      - name: Cross-process menu dismissal and buffered-page background regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-ui/evidence | Out-Null
          & ./build-ui/Release/niuma-popup-lifecycle-test.exe | Tee-Object build-ui/evidence/popup.txt
          if ($LASTEXITCODE -ne 0) { throw "Popup regression failed" }
          python scripts/prepare-windows-runtime-acceptance.py build-ui/runtime-fixtures
          if ($LASTEXITCODE -ne 0) { throw "Private fixtures failed" }
          $env:NIUMA_RUNTIME_FIXTURE_DIR = Join-Path $PWD 'build-ui/runtime-fixtures'
          & ./build-ui/Release/niuma-runtime-durability-probe.exe (Join-Path $PWD 'build-ui/evidence') 75 15 15 | Tee-Object build-ui/evidence/probe.txt
          if ($LASTEXITCODE -ne 0) { throw "Complete adapter sampler failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-runtime-ui-${{ github.sha }}
          path: |
            build-ui/evidence/**
            build-ui/Release/niuma-runtime-candidate.exe
            build-ui/Release/niuma-runtime-durability-probe.exe
            build-ui/runtime-fixtures/**
          if-no-files-found: warn
          retention-days: 14

  windows-runtime-app:
    if: ${{ inputs.mode == 'runtime-app' || inputs.mode == 'runtime-integration' || inputs.mode == 'runtime-candidate' }}
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile the real application and new input and storage adapter tests
        shell: pwsh
        run: |
          cmake -S . -B build-app -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "Application configuration failed" }
          cmake --build build-app --config Release --target niuma-merit niuma-runtime-candidate niuma-runtime-app-test --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Application compilation failed" }
      - name: Real adapter paths with isolated profiles and tagged input
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-app/evidence | Out-Null
          python scripts/prepare-windows-runtime-acceptance.py build-app/runtime-fixtures
          if ($LASTEXITCODE -ne 0) { throw "Private fixture preparation failed" }
          $env:NIUMA_RUNTIME_FIXTURE_DIR = Join-Path $PWD 'build-app/runtime-fixtures'
          if ('${{ inputs.mode }}' -eq 'runtime-candidate') {
            & ./build-app/Release/niuma-runtime-app-test.exe (Join-Path $PWD 'build-app/evidence') --composition-only | Tee-Object build-app/evidence/composition-app.txt
            if ($LASTEXITCODE -ne 0) { throw "Candidate application integration failed" }
          } else {
            & ./build-app/Release/niuma-runtime-app-test.exe (Join-Path $PWD 'build-app/evidence') | Tee-Object build-app/evidence/app.txt
            if ($LASTEXITCODE -ne 0) { throw "Application input adapter contract failed" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-runtime-app-${{ github.sha }}
          path: |
            build-app/evidence/**
            build-app/Release/niuma-runtime-candidate.exe
            build-app/Release/niuma-runtime-app-test.exe
            build-app/runtime-fixtures/**
          if-no-files-found: warn
          retention-days: 14

  windows-runtime-resources:
    if: ${{ inputs.mode == 'runtime-resources' || inputs.mode == 'runtime-integration' }}
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile bounded resource preparation and loader contracts
        shell: pwsh
        run: |
          cmake -S . -B build-resources -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "Resource configuration failed" }
          cmake --build build-resources --config Release --target niuma-appearance-resources-test niuma-appearance-service-test --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Resource compilation failed" }
      - name: Private PNG fixtures and loader lifetime contracts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-resources/evidence | Out-Null
          & ./build-resources/Release/niuma-appearance-resources-test.exe | Tee-Object build-resources/evidence/resources.txt
          $resources = $LASTEXITCODE
          & ./build-resources/Release/niuma-appearance-service-test.exe | Tee-Object build-resources/evidence/service.txt
          if ($resources -ne 0 -or $LASTEXITCODE -ne 0) { throw "Resource contract failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-runtime-resources-${{ github.sha }}
          path: build-resources/evidence/**
          if-no-files-found: warn
          retention-days: 14

  windows-runtime-composition:
    if: ${{ inputs.mode == 'runtime-composition' || inputs.mode == 'runtime-candidate' }}
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build production scene, text, presenter and complete display adapters
        shell: pwsh
        run: |
          cmake -S . -B build-composition -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "Composition configuration failed" }
          cmake --build build-composition --config Release --target niuma-fading-alpha-test niuma-appearance-scene-test niuma-widget-text-cache-test niuma-composition-presenter-test niuma-client-display-test niuma-appearance-service-test --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Composition compilation failed" }
      - name: Exercise only newly integrated scene and display paths
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-composition/evidence | Out-Null
          $failed = @()
          $scopes = if ('${{ inputs.mode }}' -eq 'runtime-candidate') { @('appearance-scene', 'client-display') } else { @('fading-alpha', 'appearance-scene', 'widget-text-cache', 'composition-presenter', 'client-display', 'appearance-service') }
          foreach ($name in $scopes) {
            & "./build-composition/Release/niuma-$name-test.exe" | Tee-Object "build-composition/evidence/$name.txt"
            if ($LASTEXITCODE -ne 0) { $failed += $name }
          }
          if ($failed.Count -ne 0) { throw "Failed composition scopes: $failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-runtime-composition-${{ github.sha }}
          path: build-composition/evidence/**
          if-no-files-found: warn
          retention-days: 14

  windows-runtime-durability:
    if: ${{ inputs.mode == 'runtime-durability' }}
    runs-on: windows-2022
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Build only the new long-running private adapter probe
        shell: pwsh
        run: |
          cmake -S . -B build-durability -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "Durability configuration failed" }
          cmake --build build-durability --config Release --target niuma-runtime-durability-probe --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Durability compilation failed" }
      - name: Validate the active/idle resource sampler for 75 seconds before any long run
        shell: pwsh
        run: |
          python scripts/prepare-windows-runtime-acceptance.py build-durability/runtime-fixtures
          if ($LASTEXITCODE -ne 0) { throw "Private durability fixtures failed" }
          New-Item -ItemType Directory -Force build-durability/evidence | Out-Null
          $env:NIUMA_RUNTIME_FIXTURE_DIR = Join-Path $PWD 'build-durability/runtime-fixtures'
          & ./build-durability/Release/niuma-runtime-durability-probe.exe (Join-Path $PWD 'build-durability/evidence') 75 15 15 | Tee-Object build-durability/evidence/probe.txt
          if ($LASTEXITCODE -ne 0) { throw "Durability sampler smoke test failed" }
          python scripts/check-windows-memory-observation.py build-durability/evidence/durability
          if ($LASTEXITCODE -ne 0) { throw "New memory observation schema failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-runtime-durability-${{ github.sha }}
          path: |
            build-durability/evidence/**
            build-durability/Release/niuma-runtime-durability-probe.exe
            build-durability/runtime-fixtures/**
          if-no-files-found: warn
          retention-days: 14

  windows-runtime-contract:
    if: ${{ inputs.mode == 'runtime-contract' }}
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Build new owner-side fallback, self-check and reminder confirmation contract
        shell: pwsh
        run: |
          cmake -S . -B build-contract -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "Contract configuration failed" }
          cmake --build build-contract --config Release --target niuma-input-contract-test --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Contract compilation failed" }
      - name: Test only new service contracts with tagged input in owned windows
        shell: pwsh
        run: |
          & ./build-contract/Release/niuma-input-contract-test.exe | Tee-Object build-contract/input-contract.txt
          if ($LASTEXITCODE -ne 0) { throw "New input contract failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-input-contract-${{ github.sha }}
          path: build-contract/input-contract.txt
          if-no-files-found: warn
          retention-days: 14

  windows-runtime-p0:
    if: ${{ inputs.mode == 'runtime-p0' || inputs.mode == 'runtime-check' }}
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Preserve pinned source bytes on this disposable runner
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Bind source artwork and inventory decoded resources
        shell: pwsh
        run: |
          python scripts/prepare-runtime-p0.py build-runtime/evidence
          if ($LASTEXITCODE -ne 0) { throw "Fixed fixture binding failed" }
      - name: Build only new shared core and composition diagnostic
        shell: pwsh
        run: |
          cmake -S . -B build-runtime -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "Runtime configuration failed" }
          cmake --build build-runtime --config Release --target niuma-runtime-p0 niuma-prepared-alpha-test --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Runtime P0 compilation failed" }
      - name: Prepared subpixel spans and sparse alpha decisions
        shell: pwsh
        run: |
          & ./build-runtime/Release/niuma-prepared-alpha-test.exe
          if ($LASTEXITCODE -ne 0) { throw "Prepared alpha region failed" }
      - name: Owned windows, separate process click witness and transparent frames
        shell: pwsh
        run: |
          & ./build-runtime/Release/niuma-runtime-p0.exe --ci-probe $PWD (Join-Path $PWD 'build-runtime/evidence') --allow-software-for-test
          if ($LASTEXITCODE -ne 0) { throw "P0 functional gate failed; no substituted hit-test messages" }
      - name: Bind unpublished diagnostic
        if: always()
        shell: pwsh
        run: |
          $file = 'build-runtime/Release/niuma-runtime-p0.exe'
          if (Test-Path $file) {
            @{ sourceCommit=$env:GITHUB_SHA; artifactKind='composition-p0-diagnostic'; sha256=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant(); installerBuilt=$false; published=$false; physicalTypingMeasured=$false } | ConvertTo-Json | Set-Content 'build-runtime/evidence/build-info.json'
          }
      - name: Retain new runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-p0-${{ github.sha }}
          path: |
            build-runtime/evidence/*
            build-runtime/Release/niuma-runtime-p0.exe
          if-no-files-found: error
          retention-days: 14

  windows-runtime-p1:
    if: ${{ inputs.mode == 'runtime-p1' || inputs.mode == 'runtime-check' }}
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Build new input service and its isolated diagnostic
        shell: pwsh
        run: |
          cmake -S . -B build-input-service -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "Input service configuration failed" }
          cmake --build build-input-service --config Release --target niuma-windows-input niuma-input-service-probe --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Input service compilation failed" }
      - name: Real hook chain while UI or simulated storage is blocked
        shell: pwsh
        run: |
          & ./build-input-service/Release/niuma-input-service-probe.exe (Join-Path $PWD 'build-input-service/input-service.json')
          if ($LASTEXITCODE -ne 0) { throw "Input isolation gate blocked or failed; do not substitute posted events" }
      - name: Bind input diagnostic to source
        if: always()
        shell: pwsh
        run: |
          $file = 'build-input-service/Release/niuma-input-service-probe.exe'
          if (Test-Path $file) {
            @{ sourceCommit=$env:GITHUB_SHA; artifactKind='dedicated-input-service-diagnostic'; sha256=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant(); productMainEntryRun=$false; productDataAccessed=$false; published=$false; physicalTypingMeasured=$false } | ConvertTo-Json | Set-Content 'build-input-service/build-info.json'
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-runtime-p1-${{ github.sha }}
          path: |
            build-input-service/input-service.json
            build-input-service/build-info.json
            build-input-service/Release/niuma-input-service-probe.exe
          if-no-files-found: warn
          retention-days: 14

  windows-compile:
    if: ${{ inputs.mode == 'profile' || inputs.mode == '' }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out the exact source candidate
        uses: actions/checkout@v4

      - name: Prepare instrumented original and candidate sources
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin 7370e7ab5e5be0c626858930ba34af172151d8ce
          if ($LASTEXITCODE -ne 0) { throw "Baseline fetch failed" }
          git fetch --no-tags --depth=1 origin 59a2304aee8c83b95889d692ca01d2db9d17fc1b
          if ($LASTEXITCODE -ne 0) { throw "Prior candidate fetch failed" }
          python scripts/prepare-windows-render-profile.py build-offwork
          if ($LASTEXITCODE -ne 0) { throw "Profile preparation failed" }

      - name: Configure Windows x64
        shell: pwsh
        run: |
          cmake -S . -B build-offwork -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed" }

      - name: Compile original and candidate profilers
        shell: pwsh
        run: |
          cmake --build build-offwork --config Release --target niuma-merit niuma-render-profile-before niuma-render-profile-previous niuma-render-profile-after --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Client compilation failed" }

      - name: Profile real drawing stages and synthetic count handling
        shell: pwsh
        run: |
          & ./build-offwork/Release/niuma-render-profile-before.exe $PWD (Join-Path $PWD 'build-offwork/profile-before.json')
          if ($LASTEXITCODE -ne 0) { throw "Original profile failed" }
          & ./build-offwork/Release/niuma-render-profile-previous.exe $PWD (Join-Path $PWD 'build-offwork/profile-prior-cache.json')
          if ($LASTEXITCODE -ne 0) { throw "Prior candidate memory sample failed" }
          & ./build-offwork/Release/niuma-render-profile-after.exe $PWD (Join-Path $PWD 'build-offwork/profile-after.json')
          if ($LASTEXITCODE -ne 0) { throw "Candidate profile failed" }

      - name: Compare controls and display-sized image quality
        shell: pwsh
        run: |
          python scripts/compare-windows-render-frames.py build-offwork
          if ($LASTEXITCODE -ne 0) { throw "Frame comparison failed" }

      - name: Bind the unpublished candidate to its source
        shell: pwsh
        run: |
          $exe = Get-Item "build-offwork/Release/niuma-render-profile-after.exe"
          $record = [ordered]@{
            sourceCommit = $env:GITHUB_SHA
            sourceVersion = (Get-Content VERSION -Raw).Trim()
            platform = 'windows-x64'
            bytes = $exe.Length
            sha256 = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            candidateOnly = $true
            artifactKind = 'render-profiler'
            candidateClientSha256 = (Get-FileHash build-offwork/Release/niuma-merit.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            clientExecuted = $false
            productTestsRun = $false
            renderCacheChecksRun = 'reused-from-run-39829177500'
            renderPathProfilesRun = $true
            installerBuilt = $false
            published = $false
          }
          $record | ConvertTo-Json | Set-Content "build-offwork/build-info.json" -Encoding utf8

      - name: Retain the development executable and source binding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offwork-windows-dev-${{ github.sha }}
          path: |
            build-offwork/Release/niuma-render-profile-before.exe
            build-offwork/Release/niuma-render-profile-after.exe
            build-offwork/Release/niuma-merit.exe
            build-offwork/profile-before.json
            build-offwork/profile-after.json
            build-offwork/profile-prior-cache.json
            build-offwork/render-profile-source.json
            build-offwork/comparison-phase-*.png
            build-offwork/frame-comparison.json
            build-offwork/build-info.json
          if-no-files-found: error
          retention-days: 14

  windows-soak:
    if: ${{ inputs.mode == 'soak' }}
    runs-on: windows-2022
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        phase: [before, after]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixed original and redesigned sources
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin 7370e7ab5e5be0c626858930ba34af172151d8ce
          if ($LASTEXITCODE -ne 0) { throw "Baseline fetch failed" }
          git fetch --no-tags --depth=1 origin 59a2304aee8c83b95889d692ca01d2db9d17fc1b
          if ($LASTEXITCODE -ne 0) { throw "Prior source fetch failed" }
          python scripts/prepare-windows-render-profile.py build-soak
          if ($LASTEXITCODE -ne 0) { throw "Preparation failed" }
          cmake -S . -B build-soak -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "Configuration failed" }
      - name: Compile only the new endurance diagnostic
        shell: pwsh
        run: |
          cmake --build build-soak --config Release --target niuma-render-profile-${{ matrix.phase }} --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic compilation failed" }
      - name: Run five real minutes of input, resource churn and idle recovery
        shell: pwsh
        run: |
          & ./build-soak/Release/niuma-render-profile-${{ matrix.phase }}.exe $PWD (Join-Path $PWD 'build-soak/soak-${{ matrix.phase }}.json') --soak
          if ($LASTEXITCODE -ne 0) { throw "Endurance diagnostic failed" }
          python scripts/summarize-windows-render-soak.py build-soak/soak-${{ matrix.phase }}.json
          if ($LASTEXITCODE -ne 0) { throw "Endurance resource gate failed" }
      - name: Bind diagnostic source
        if: always()
        shell: pwsh
        run: |
          $path = 'build-soak/Release/niuma-render-profile-${{ matrix.phase }}.exe'
          if (Test-Path $path) {
            @{ sourceCommit=$env:GITHUB_SHA; phase='${{ matrix.phase }}'; sha256=(Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant(); installerBuilt=$false; published=$false; physicalTypingMeasured=$false } | ConvertTo-Json | Set-Content 'build-soak/soak-binding.json'
          }
      - name: Retain only synthetic endurance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-soak-${{ matrix.phase }}-${{ github.sha }}
          path: |
            build-soak/soak-*.json
            build-soak/render-profile-source.json
          if-no-files-found: error
          retention-days: 14

  windows-keyboard-chain:
    if: ${{ inputs.mode == 'keyboard-chain' }}
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned original and redesigned callbacks
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin 7370e7ab5e5be0c626858930ba34af172151d8ce
          if ($LASTEXITCODE -ne 0) { throw "Baseline fetch failed" }
          git fetch --no-tags --depth=1 origin 59a2304aee8c83b95889d692ca01d2db9d17fc1b
          if ($LASTEXITCODE -ne 0) { throw "Prior source fetch failed" }
          python scripts/prepare-windows-render-profile.py build-input
          if ($LASTEXITCODE -ne 0) { throw "Source preparation failed" }
          cmake -S . -B build-input -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "Configuration failed" }
          cmake --build build-input --config Release --target niuma-render-profile-before niuma-render-profile-after --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Input diagnostic compilation failed" }
      - name: Exercise actual Windows hook chain on the dedicated runner
        shell: pwsh
        run: |
          & ./build-input/Release/niuma-render-profile-before.exe $PWD (Join-Path $PWD 'build-input/keyboard-before.json') --keyboard-chain
          $before = $LASTEXITCODE
          & ./build-input/Release/niuma-render-profile-after.exe $PWD (Join-Path $PWD 'build-input/keyboard-after.json') --keyboard-chain
          if ($before -ne 0 -or $LASTEXITCODE -ne 0) { throw "Real hook-chain test blocked or failed; do not substitute posted messages" }
      - name: Retain input-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-keyboard-chain-${{ github.sha }}
          path: |
            build-input/keyboard-*.json
            build-input/render-profile-source.json
          if-no-files-found: error
          retention-days: 14

name: Offwork Client Compile Only
run-name: Offwork compile-only ${{ github.sha }}

on:
  # Manual only: the branch this used to watch is gone, and a push trigger on a
  # deleted branch can never fire.
  workflow_dispatch:
    inputs:
      mode:
        description: Native test scope
        type: choice
        default: profile
        options: [profile, soak, keyboard-chain, runtime-p0]

permissions:
  contents: read

concurrency:
  group: offwork-client-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-runtime-p0:
    if: ${{ inputs.mode == 'runtime-p0' }}
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Bind source artwork and inventory decoded resources
        shell: pwsh
        run: |
          python scripts/prepare-runtime-p0.py build-runtime/evidence
          if ($LASTEXITCODE -ne 0) { throw "Fixed fixture binding failed" }
      - name: Build only new shared core and composition diagnostic
        shell: pwsh
        run: |
          cmake -S . -B build-runtime -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "Runtime configuration failed" }
          cmake --build build-runtime --config Release --target niuma-runtime-p0 niuma-client-input-test niuma-alpha-region-test --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Runtime P0 compilation failed" }
      - name: New pure-core rules and CPU hit-region tests
        shell: pwsh
        run: |
          & ./build-runtime/Release/niuma-client-input-test.exe
          if ($LASTEXITCODE -ne 0) { throw "Input core failed" }
          & ./build-runtime/Release/niuma-alpha-region-test.exe
          if ($LASTEXITCODE -ne 0) { throw "Alpha region failed" }
      - name: Owned windows, separate process click witness and transparent frames
        shell: pwsh
        run: |
          & ./build-runtime/Release/niuma-runtime-p0.exe --ci-probe $PWD (Join-Path $PWD 'build-runtime/evidence') --allow-software-for-test
          if ($LASTEXITCODE -ne 0) { throw "P0 functional gate failed; no substituted hit-test messages" }
      - name: Bind unpublished diagnostic
        if: always()
        shell: pwsh
        run: |
          $file = 'build-runtime/Release/niuma-runtime-p0.exe'
          if (Test-Path $file) {
            @{ sourceCommit=$env:GITHUB_SHA; artifactKind='composition-p0-diagnostic'; sha256=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant(); installerBuilt=$false; published=$false; physicalTypingMeasured=$false } | ConvertTo-Json | Set-Content 'build-runtime/evidence/build-info.json'
          }
      - name: Retain new runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-p0-${{ github.sha }}
          path: |
            build-runtime/evidence/*
            build-runtime/Release/niuma-runtime-p0.exe
          if-no-files-found: error
          retention-days: 14

  windows-compile:
    if: ${{ inputs.mode == 'profile' || inputs.mode == '' }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out the exact source candidate
        uses: actions/checkout@v4

      - name: Prepare instrumented original and candidate sources
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin 7370e7ab5e5be0c626858930ba34af172151d8ce
          if ($LASTEXITCODE -ne 0) { throw "Baseline fetch failed" }
          git fetch --no-tags --depth=1 origin 59a2304aee8c83b95889d692ca01d2db9d17fc1b
          if ($LASTEXITCODE -ne 0) { throw "Prior candidate fetch failed" }
          python scripts/prepare-windows-render-profile.py build-offwork
          if ($LASTEXITCODE -ne 0) { throw "Profile preparation failed" }

      - name: Configure Windows x64
        shell: pwsh
        run: |
          cmake -S . -B build-offwork -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed" }

      - name: Compile original and candidate profilers
        shell: pwsh
        run: |
          cmake --build build-offwork --config Release --target niuma-merit niuma-render-profile-before niuma-render-profile-previous niuma-render-profile-after --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Client compilation failed" }

      - name: Profile real drawing stages and synthetic count handling
        shell: pwsh
        run: |
          & ./build-offwork/Release/niuma-render-profile-before.exe $PWD (Join-Path $PWD 'build-offwork/profile-before.json')
          if ($LASTEXITCODE -ne 0) { throw "Original profile failed" }
          & ./build-offwork/Release/niuma-render-profile-previous.exe $PWD (Join-Path $PWD 'build-offwork/profile-prior-cache.json')
          if ($LASTEXITCODE -ne 0) { throw "Prior candidate memory sample failed" }
          & ./build-offwork/Release/niuma-render-profile-after.exe $PWD (Join-Path $PWD 'build-offwork/profile-after.json')
          if ($LASTEXITCODE -ne 0) { throw "Candidate profile failed" }

      - name: Compare controls and display-sized image quality
        shell: pwsh
        run: |
          python scripts/compare-windows-render-frames.py build-offwork
          if ($LASTEXITCODE -ne 0) { throw "Frame comparison failed" }

      - name: Bind the unpublished candidate to its source
        shell: pwsh
        run: |
          $exe = Get-Item "build-offwork/Release/niuma-render-profile-after.exe"
          $record = [ordered]@{
            sourceCommit = $env:GITHUB_SHA
            sourceVersion = (Get-Content VERSION -Raw).Trim()
            platform = 'windows-x64'
            bytes = $exe.Length
            sha256 = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            candidateOnly = $true
            artifactKind = 'render-profiler'
            candidateClientSha256 = (Get-FileHash build-offwork/Release/niuma-merit.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            clientExecuted = $false
            productTestsRun = $false
            renderCacheChecksRun = 'reused-from-run-39829177500'
            renderPathProfilesRun = $true
            installerBuilt = $false
            published = $false
          }
          $record | ConvertTo-Json | Set-Content "build-offwork/build-info.json" -Encoding utf8

      - name: Retain the development executable and source binding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offwork-windows-dev-${{ github.sha }}
          path: |
            build-offwork/Release/niuma-render-profile-before.exe
            build-offwork/Release/niuma-render-profile-after.exe
            build-offwork/Release/niuma-merit.exe
            build-offwork/profile-before.json
            build-offwork/profile-after.json
            build-offwork/profile-prior-cache.json
            build-offwork/render-profile-source.json
            build-offwork/comparison-phase-*.png
            build-offwork/frame-comparison.json
            build-offwork/build-info.json
          if-no-files-found: error
          retention-days: 14

  windows-soak:
    if: ${{ inputs.mode == 'soak' }}
    runs-on: windows-2022
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        phase: [before, after]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixed original and redesigned sources
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin 7370e7ab5e5be0c626858930ba34af172151d8ce
          if ($LASTEXITCODE -ne 0) { throw "Baseline fetch failed" }
          git fetch --no-tags --depth=1 origin 59a2304aee8c83b95889d692ca01d2db9d17fc1b
          if ($LASTEXITCODE -ne 0) { throw "Prior source fetch failed" }
          python scripts/prepare-windows-render-profile.py build-soak
          if ($LASTEXITCODE -ne 0) { throw "Preparation failed" }
          cmake -S . -B build-soak -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "Configuration failed" }
      - name: Compile only the new endurance diagnostic
        shell: pwsh
        run: |
          cmake --build build-soak --config Release --target niuma-render-profile-${{ matrix.phase }} --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic compilation failed" }
      - name: Run five real minutes of input, resource churn and idle recovery
        shell: pwsh
        run: |
          & ./build-soak/Release/niuma-render-profile-${{ matrix.phase }}.exe $PWD (Join-Path $PWD 'build-soak/soak-${{ matrix.phase }}.json') --soak
          if ($LASTEXITCODE -ne 0) { throw "Endurance diagnostic failed" }
          python scripts/summarize-windows-render-soak.py build-soak/soak-${{ matrix.phase }}.json
          if ($LASTEXITCODE -ne 0) { throw "Endurance resource gate failed" }
      - name: Bind diagnostic source
        if: always()
        shell: pwsh
        run: |
          $path = 'build-soak/Release/niuma-render-profile-${{ matrix.phase }}.exe'
          if (Test-Path $path) {
            @{ sourceCommit=$env:GITHUB_SHA; phase='${{ matrix.phase }}'; sha256=(Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant(); installerBuilt=$false; published=$false; physicalTypingMeasured=$false } | ConvertTo-Json | Set-Content 'build-soak/soak-binding.json'
          }
      - name: Retain only synthetic endurance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-soak-${{ matrix.phase }}-${{ github.sha }}
          path: |
            build-soak/soak-*.json
            build-soak/render-profile-source.json
          if-no-files-found: error
          retention-days: 14

  windows-keyboard-chain:
    if: ${{ inputs.mode == 'keyboard-chain' }}
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned original and redesigned callbacks
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin 7370e7ab5e5be0c626858930ba34af172151d8ce
          if ($LASTEXITCODE -ne 0) { throw "Baseline fetch failed" }
          git fetch --no-tags --depth=1 origin 59a2304aee8c83b95889d692ca01d2db9d17fc1b
          if ($LASTEXITCODE -ne 0) { throw "Prior source fetch failed" }
          python scripts/prepare-windows-render-profile.py build-input
          if ($LASTEXITCODE -ne 0) { throw "Source preparation failed" }
          cmake -S . -B build-input -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "Configuration failed" }
          cmake --build build-input --config Release --target niuma-render-profile-before niuma-render-profile-after --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Input diagnostic compilation failed" }
      - name: Exercise actual Windows hook chain on the dedicated runner
        shell: pwsh
        run: |
          & ./build-input/Release/niuma-render-profile-before.exe $PWD (Join-Path $PWD 'build-input/keyboard-before.json') --keyboard-chain
          $before = $LASTEXITCODE
          & ./build-input/Release/niuma-render-profile-after.exe $PWD (Join-Path $PWD 'build-input/keyboard-after.json') --keyboard-chain
          if ($before -ne 0 -or $LASTEXITCODE -ne 0) { throw "Real hook-chain test blocked or failed; do not substitute posted messages" }
      - name: Retain input-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-keyboard-chain-${{ github.sha }}
          path: |
            build-input/keyboard-*.json
            build-input/render-profile-source.json
          if-no-files-found: error
          retention-days: 14

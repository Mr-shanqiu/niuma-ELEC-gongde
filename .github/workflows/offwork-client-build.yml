name: Offwork Client Compile Only
run-name: Offwork compile-only ${{ github.sha }}

on:
  # Manual only: the branch this used to watch is gone, and a push trigger on a
  # deleted branch can never fire.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offwork-client-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-compile:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out the exact source candidate
        uses: actions/checkout@v4

      - name: Prepare instrumented original and candidate sources
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin 7370e7ab5e5be0c626858930ba34af172151d8ce
          if ($LASTEXITCODE -ne 0) { throw "Baseline fetch failed" }
          python scripts/prepare-windows-render-profile.py build-offwork
          if ($LASTEXITCODE -ne 0) { throw "Profile preparation failed" }

      - name: Configure Windows x64
        shell: pwsh
        run: |
          cmake -S . -B build-offwork -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed" }

      - name: Compile original and candidate profilers
        shell: pwsh
        run: |
          cmake --build build-offwork --config Release --target niuma-merit niuma-render-profile-before niuma-render-profile-after --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Client compilation failed" }

      - name: Profile real drawing stages and synthetic count handling
        shell: pwsh
        run: |
          & ./build-offwork/Release/niuma-render-profile-before.exe $PWD (Join-Path $PWD 'build-offwork/profile-before.json')
          if ($LASTEXITCODE -ne 0) { throw "Original profile failed" }
          & ./build-offwork/Release/niuma-render-profile-after.exe $PWD (Join-Path $PWD 'build-offwork/profile-after.json')
          if ($LASTEXITCODE -ne 0) { throw "Candidate profile failed" }

      - name: Compare controls and display-sized image quality
        shell: pwsh
        run: |
          python scripts/compare-windows-render-frames.py build-offwork
          if ($LASTEXITCODE -ne 0) { throw "Frame comparison failed" }

      - name: Bind the unpublished candidate to its source
        shell: pwsh
        run: |
          $exe = Get-Item "build-offwork/Release/niuma-render-profile-after.exe"
          $record = [ordered]@{
            sourceCommit = $env:GITHUB_SHA
            sourceVersion = (Get-Content VERSION -Raw).Trim()
            platform = 'windows-x64'
            bytes = $exe.Length
            sha256 = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            candidateOnly = $true
            artifactKind = 'render-profiler'
            candidateClientSha256 = (Get-FileHash build-offwork/Release/niuma-merit.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            clientExecuted = $false
            productTestsRun = $false
            renderCacheChecksRun = 'reused-from-run-39829177500'
            renderPathProfilesRun = $true
            installerBuilt = $false
            published = $false
          }
          $record | ConvertTo-Json | Set-Content "build-offwork/build-info.json" -Encoding utf8

      - name: Retain the development executable and source binding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offwork-windows-dev-${{ github.sha }}
          path: |
            build-offwork/Release/niuma-render-profile-before.exe
            build-offwork/Release/niuma-render-profile-after.exe
            build-offwork/Release/niuma-merit.exe
            build-offwork/profile-before.json
            build-offwork/profile-after.json
            build-offwork/render-profile-source.json
            build-offwork/comparison-phase-*.png
            build-offwork/frame-comparison.json
            build-offwork/build-info.json
          if-no-files-found: error
          retention-days: 14

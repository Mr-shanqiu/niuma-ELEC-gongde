services:
  gongde-redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/gongde-redis-entrypoint"]
    volumes:
      - ./gongde-redis-entrypoint.sh:/usr/local/bin/gongde-redis-entrypoint:ro
      - gongde_redis_data:/data
    secrets: [gongde_redis_password]
    networks: [gongde_backend]
    read_only: true
    tmpfs: [/tmp:size=8m,mode=1777]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 64
    cpus: 0.10
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/gongde_redis_password) redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  gongde-api:
    image: gongde-api:${GONGDE_API_IMAGE_TAG:?Set reviewed image tag}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ["${GONGDE_ENV_FILE:-production.env}"]
    depends_on:
      gongde-redis: { condition: service_healthy }
    secrets:
      - gongde_mysql_app_password
      - gongde_sms_identity_secret
      - gongde_sms_redis_url
      - tencent_cloud_secret_id
      - tencent_cloud_secret_key
      - wechat_pay_merchant_private_key
      - wechat_pay_public_key
      - wechat_pay_api_v3_key
      - alipay_app_private_key
      - alipay_public_key
      - gongde_pack_signing_key
    volumes:
      - ${GONGDE_PACK_ASSET_HOST_DIR:?Set reviewed asset root}:/app/assets:ro
    networks: [gongde_backend, api_egress, frontend]
    read_only: true
    tmpfs: [/tmp:size=16m,mode=1777]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 96
    cpus: 0.25
    mem_limit: 128m

  gongde-db-bootstrap:
    profiles: [operations]
    image: mysql:8.4.11
    entrypoint: ["/opt/gongde/gongde-db-bootstrap.sh"]
    volumes:
      - ./gongde-db-bootstrap.sh:/opt/gongde/gongde-db-bootstrap.sh:ro
    secrets: [mysql_root_password, gongde_mysql_app_password, gongde_mysql_migrator_password]
    networks: [gongde_backend]
    read_only: true
    tmpfs: [/tmp:size=8m,mode=1777]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  gongde-db-migrate:
    profiles: [operations]
    image: gongde-api:${GONGDE_API_IMAGE_TAG:?Set reviewed image tag}
    env_file: ["${GONGDE_ENV_FILE:-production.env}"]
    environment:
      GONGDE_MYSQL_USER: gongde_migrator
      GONGDE_MYSQL_PASSWORD_FILE: /run/secrets/gongde_mysql_migrator_password
    command: ["node", "scripts/migrate.mjs"]
    secrets: [gongde_mysql_migrator_password]
    networks: [gongde_backend]
    read_only: true
    tmpfs: [/tmp:size=8m,mode=1777]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  gongde_backend:
    external: true
    name: zqscreen_gongde_backend
  api_egress:
    external: true
    name: zqscreen_api_egress
  frontend:
    external: true
    name: zqscreen_frontend

volumes:
  gongde_redis_data:

secrets:
  mysql_root_password: { file: "${MYSQL_ROOT_PASSWORD_FILE:?Set MySQL root secret file}" }
  gongde_mysql_app_password: { file: "${GONGDE_SECRET_DIR:?Set Gongde secret dir}/gongde_mysql_app_password" }
  gongde_mysql_migrator_password: { file: "${GONGDE_SECRET_DIR:?Set Gongde secret dir}/gongde_mysql_migrator_password" }
  gongde_redis_password: { file: "${GONGDE_SECRET_DIR:?Set Gongde secret dir}/gongde_redis_password" }
  gongde_sms_identity_secret: { file: "${GONGDE_SECRET_DIR:?Set Gongde secret dir}/gongde_sms_identity_secret" }
  gongde_sms_redis_url: { file: "${GONGDE_SECRET_DIR:?Set Gongde secret dir}/gongde_sms_redis_url" }
  gongde_pack_signing_key: { file: "${GONGDE_SECRET_DIR:?Set Gongde secret dir}/gongde_pack_signing_key" }
  tencent_cloud_secret_id: { file: "${SHARED_SECRET_DIR:?Set shared secret dir}/tencent_cloud_secret_id" }
  tencent_cloud_secret_key: { file: "${SHARED_SECRET_DIR:?Set shared secret dir}/tencent_cloud_secret_key" }
  wechat_pay_merchant_private_key: { file: "${SHARED_SECRET_DIR:?Set shared secret dir}/wechat_pay_merchant_private_key" }
  wechat_pay_public_key: { file: "${SHARED_SECRET_DIR:?Set shared secret dir}/wechat_pay_public_key" }
  wechat_pay_api_v3_key: { file: "${SHARED_SECRET_DIR:?Set shared secret dir}/wechat_pay_api_v3_key" }
  alipay_app_private_key: { file: "${SHARED_SECRET_DIR:?Set shared secret dir}/alipay_app_private_key" }
  alipay_public_key: { file: "${SHARED_SECRET_DIR:?Set shared secret dir}/alipay_public_key" }

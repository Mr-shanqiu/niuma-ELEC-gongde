name: Windows One Page Installation

on:
  pull_request:
    paths:
      - 'installer/windows/startup-choice.iss'
      - 'installer/windows/niuma-merit-unified-acceptance-r3.iss'
      - 'scripts/test-windows-acceptance-r2.ps1'
      - '.github/workflows/windows-onepage-installer.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package-and-check:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reuse the verified R3 client without recompiling
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39138931526
          name: windows-unified-acceptance-r3
          path: .local-work/candidates/onepage/fixed
      - name: Package one page acceptance and production installers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD '.local-work/candidates/onepage'
          $client = "$root/fixed/niuma-merit.exe"
          if ((Get-FileHash $client -Algorithm SHA256).Hash.ToLowerInvariant() -ne '24b29f28dc629a1dfc3e4abedb7fd75d819f596889189dcd0b404390071cadff') { throw 'Fixed R3 client differs' }
          $output = "$root/output"
          New-Item -ItemType Directory -Path $output | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Installer compiler unavailable' }
          }
          & $iscc "/DClientExecutable=$client" "/DAcceptanceOutputDir=$output" 'installer/windows/niuma-merit-unified-acceptance-r3.iss'
          if ($LASTEXITCODE -ne 0) { throw 'One page candidate packaging failed' }
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          Copy-Item $client 'dist/niuma-merit.exe'
          & $iscc '/DMyAppVersion=0.9.4' "/O$root/production-template-check" 'installer/windows/niuma-merit.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Production template compilation failed' }
          Copy-Item $client $output
          Get-ChildItem $output -File | ForEach-Object {
            @{filename=$_.Name; bytes=$_.Length; sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
          } | ConvertTo-Json | Set-Content -Encoding UTF8 "$output/BUILD_RECEIPT.json"
      - name: Require Install directly on the first page in all three language cases
        shell: powershell
        run: |
          $output = Join-Path $PWD '.local-work/candidates/onepage/output'
          $installer = @(Get-ChildItem $output -Filter '*.exe' | Where-Object { $_.Name -ne 'niuma-merit.exe' })
          if ($installer.Count -ne 1) { throw 'Expected one installer' }
          & ./scripts/test-windows-acceptance-r2.ps1 -InstallerPath $installer[0].FullName -ClientPath "$output/niuma-merit.exe" -EvidenceDirectory "$output/journey" -CandidateRevision R3 -RequireSinglePage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-r3-onepage-installer
          path: .local-work/candidates/onepage/output/*
          if-no-files-found: error
          retention-days: 7
